{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 30px; text-align: center;">
    <h1 style="font-size: 1.75rem; font-weight: 700;">EDIT CASE <span
            style="font-weight: 300; opacity: 0.6;">{{ fir.fir_number }}</span></h1>
    <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;">
        UPDATE AND MODIFY EXISTING FIR RECORD
    </div>
</div>

{% if error %}
<div style="max-width: 900px; margin: 0 auto 20px; background: rgba(239,68,68,.15); border: 1px solid #ef4444; border-radius: 8px; padding: 15px; color: #ef4444;">
    <i class="fas fa-exclamation-triangle"></i> {{ error }}
</div>
{% endif %}

<form id="firForm" action="/firs/{{ fir.id }}/edit" method="post" enctype="multipart/form-data">
    <div style="max-width: 900px; margin: 0 auto;">
        <div class="chart-container" style="background: var(--secondary-bg);">
            <div class="chart-header">
                <span>Case Details</span>
                <span style="float: right; font-size: 0.75rem; font-weight: 400; opacity: 0.7;">
                    Created: {{ fir.created_at.strftime('%Y-%m-%d %H:%M') if fir.created_at else 'N/A' }}
                </span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">FIR Number</label>
                    <input type="text" name="fir_number" value="{{ fir.fir_number }}" required
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Incident Title</label>
                    <input type="text" name="title" value="{{ fir.title }}" required
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Station Name</label>
                    <input type="text" name="station_name" value="{{ fir.station_name }}" required
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">District</label>
                    <input type="text" name="district" value="{{ fir.district }}" required
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Incident Date</label>
                    <input type="date" name="incident_date" value="{{ fir.incident_date }}"
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Incident Time</label>
                    <input type="time" name="incident_time" value="{{ fir.incident_time }}"
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Priority</label>
                    <select name="priority" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                        <option value="Low" {% if fir.priority == 'Low' %}selected{% endif %}>Low</option>
                        <option value="Medium" {% if fir.priority == 'Medium' or not fir.priority %}selected{% endif %}>Medium</option>
                        <option value="High" {% if fir.priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Critical" {% if fir.priority == 'Critical' %}selected{% endif %}>Critical</option>
                    </select>
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Status</label>
                    <select name="status" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                        <option value="Open" {% if fir.status == 'Open' %}selected{% endif %}>Open</option>
                        <option value="Under Investigation" {% if fir.status == 'Under Investigation' %}selected{% endif %}>Under Investigation</option>
                        <option value="Active Search" {% if fir.status == 'Active Search' %}selected{% endif %}>Active Search</option>
                        <option value="In Custody" {% if fir.status == 'In Custody' %}selected{% endif %}>In Custody</option>
                        <option value="Resolved" {% if fir.status == 'Resolved' %}selected{% endif %}>Resolved</option>
                        <option value="Closed" {% if fir.status == 'Closed' %}selected{% endif %}>Closed</option>
                    </select>
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Crime Type</label>
                    <select name="crime_type" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                        <option value="">Auto-detect</option>
                        <option value="Theft" {% if fir.crime_type == 'Theft' %}selected{% endif %}>Theft</option>
                        <option value="Robbery" {% if fir.crime_type == 'Robbery' %}selected{% endif %}>Robbery</option>
                        <option value="Assault / Hurt" {% if fir.crime_type == 'Assault / Hurt' %}selected{% endif %}>Assault / Hurt</option>
                        <option value="Assault / Harassment" {% if fir.crime_type == 'Assault / Harassment' %}selected{% endif %}>Harassment</option>
                        <option value="Murder" {% if fir.crime_type == 'Murder' %}selected{% endif %}>Murder</option>
                        <option value="Kidnapping" {% if fir.crime_type == 'Kidnapping' %}selected{% endif %}>Kidnapping</option>
                        <option value="Fraud" {% if fir.crime_type == 'Fraud' %}selected{% endif %}>Fraud</option>
                        <option value="Criminal Intimidation" {% if fir.crime_type == 'Criminal Intimidation' %}selected{% endif %}>Intimidation</option>
                        <option value="Property Damage" {% if fir.crime_type == 'Property Damage' %}selected{% endif %}>Property Damage</option>
                        <option value="Other" {% if fir.crime_type == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Weapon Used</label>
                    <select name="weapon_used" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                        <option value="">None / Unknown</option>
                        <option value="None" {% if fir.weapon_used == 'None' %}selected{% endif %}>None</option>
                        <option value="Knife" {% if fir.weapon_used == 'Knife' %}selected{% endif %}>Knife</option>
                        <option value="Firearm" {% if fir.weapon_used == 'Firearm' %}selected{% endif %}>Firearm / Gun</option>
                        <option value="Weapon" {% if fir.weapon_used == 'Weapon' %}selected{% endif %}>Weapon</option>
                        <option value="Stick" {% if fir.weapon_used == 'Stick' %}selected{% endif %}>Stick / Bat</option>
                        <option value="Bottle" {% if fir.weapon_used == 'Bottle' %}selected{% endif %}>Bottle</option>
                        <option value="Digital" {% if fir.weapon_used == 'Digital' %}selected{% endif %}>Digital / Online</option>
                        <option value="Other" {% if fir.weapon_used == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Victim Age</label>
                    <input type="number" name="victim_age" min="1" max="150" value="{{ fir.victim_age or '' }}"
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Victim Gender</label>
                    <select name="victim_gender" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                        <option value="">Unknown</option>
                        <option value="Male" {% if fir.victim_gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if fir.victim_gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if fir.victim_gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Complainant Name</label>
                    <input type="text" name="complainant_name" value="{{ fir.complainant_name or '' }}"
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
                <div>
                    <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Accused Name</label>
                    <input type="text" name="accused_name" value="{{ fir.accused_name or '' }}"
                        style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Place of Occurrence</label>
                <input type="text" name="location_text" value="{{ fir.location_text or '' }}"
                    style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Legal Section (IPC/BNS)</label>
                <input type="text" name="legal_section" value="{{ fir.legal_section or '' }}"
                    style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Detailed Description</label>
                <textarea name="description" rows="5"
                    style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">{{ fir.description or '' }}</textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Evidence Summary</label>
                <textarea name="evidence_summary" rows="3"
                    style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">{{ fir.evidence_summary or '' }}</textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Tags (comma separated)</label>
                <input type="text" name="tags" value="{{ fir.tags or '' }}"
                    style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 12px;">
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button type="submit" class="btn-primary-custom" style="padding: 15px 40px; font-size: 1.1rem; flex: 1;">
                    <i class="fas fa-save"></i> Update FIR
                </button>
                <a href="/firs" style="background: var(--card-bg); color: var(--text-muted); padding: 15px 20px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); text-decoration: none; display: flex; align-items: center;">
                    Cancel
                </a>
                <a href="/firs/{{ fir.id }}/delete" onclick="return confirm('Delete FIR {{ fir.fir_number }}? This cannot be undone.')" style="background: rgba(239,68,68,.15); color: #ef4444; padding: 15px 20px; border-radius: 8px; cursor: pointer; border: none; text-decoration: none; display: flex; align-items: center;">
                    <i class="fas fa-trash"></i>
                </a>
            </div>
        </div>
    </div>
</form>
{% endblock %}
